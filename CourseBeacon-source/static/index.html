<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CourseBeacon</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
  <header><h1>CourseBeacon</h1><div class="primary-actions"><button id="refresh" disabled>正在启动…</button><p>启动时检查一次，此后点击按钮手动检查</p></div></header>
  <main>
    <div id="notice" role="status" aria-live="polite">正在连接本地服务…</div>
    <section id="browser-setup" hidden><p>请在本机 Chrome 地址栏打开 <code>chrome://inspect/#remote-debugging</code>，勾选允许远程调试，并允许连接提示。完成后点击上方“检查作业”。</p><p>程序连接现有 Chrome，保留已有登录状态；退出 CourseBeacon 不会关闭你的 Chrome。</p></section>
    <section aria-label="未完成作业" class="task-list"><div class="bottomList"><ul id="items"></ul></div></section>
    <p id="empty" hidden>暂无未完成作业</p>
    <footer>
      <div class="toolbar"><span id="summary"></span><button id="settings-toggle" aria-expanded="false">设置</button></div>
      <p id="sync-note">剩余时间为上次检查时的超星原文，点击“检查作业”更新。</p>
      <details id="errors" hidden><summary>部分课程读取失败</summary><ul></ul></details>
      <section id="settings" hidden aria-label="设置">
        <label>下次启动端口 <input id="port" type="number" min="1024" max="65535" value="17890"></label>
        <button id="save">保存</button><button id="stop">退出 CourseBeacon</button>
        <p id="settings-message"></p>
      </section>
    </footer>
  </main>
</body>
</html>
